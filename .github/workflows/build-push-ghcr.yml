name: Build and push image to GitHub Container Registry

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Node.js (Vaadin frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build production jar
        run: ./gradlew --no-daemon clean vaadinBuildFrontend bootJar -x test

      - name: Compute image name
        id: image
        run: |
          # Image names must be lowercase
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Pull requests only prove the image builds; nothing is published
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      # Merges to main go to production: ask the private deploy repository to move both apps to this image.
      # DEPLOY_PAT is a fine-grained token limited to that one repository (Actions: read and write).
      - name: Promote to production (Tamil and Hindi)
        if: github.event_name == 'push'
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          if [ -z "$DEPLOY_PAT" ]; then
            echo "DEPLOY_PAT not set - image published, deployment not triggered"; exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skumaroh/langtool-deploy/actions/workflows/promote-assessment.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"deploy_tamil\":\"true\",\"deploy_hindi\":\"true\",\"image_tag\":\"${{ github.sha }}\"}}"
          echo "Triggered promotion of ${{ github.sha }}"
