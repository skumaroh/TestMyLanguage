name: Build and push the speech service image

# The speech service (tts/) is Meta's open-source MMS-TTS behind a tiny HTTP server. It changes rarely, so this workflow runs only when
# tts/ changes (and by hand). Pull requests only prove the image builds; merges to main publish ghcr.io/<owner>/testmylanguage-tts:<sha>.
# The package must be set to Public once (GitHub, Packages, package settings) so the cluster can pull it without a secret.

on:
  push:
    branches: ["main"]
    paths: ["tts/**", ".github/workflows/build-push-tts.yml"]
  pull_request:
    branches: ["main"]
    paths: ["tts/**", ".github/workflows/build-push-tts.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-tts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}-tts" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: tts
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
