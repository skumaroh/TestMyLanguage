server.port=${PORT:8080}
logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false

# Vaadin. Production mode is turned on by the "prod" profile (application-prod.properties).
vaadin.launch-browser=false
vaadin.productionMode=false
vaadin.pnpm.enable=false
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,com.infotech.lang.application

# Language of this deployment (tamil or hindi). If empty, it is derived from the datasource URL.
app.language=${APP_LANGUAGE:}

# PostgreSQL. DATABASE_URL is required (no default). Schema changes come from migrations, never from Hibernate.
spring.datasource.url=${DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Azure Blob Storage (container-scoped SAS or connection string, supplied by the environment)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
# Optional blob used by the home page to prove a read works: container name and blob name
assessment.blob-check.container=${ASSESSMENT_BLOB_CHECK_CONTAINER:}
assessment.blob-check.blob=${ASSESSMENT_BLOB_CHECK_BLOB:}

# Email (SendGrid) for verification and password reset
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@mylangskills.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:TestMyLanguage}
app.base.url=${APP_BASE_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Health probes for Kubernetes (/actuator/health/liveness and /actuator/health/readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Show each component's UP/DOWN (never details) so /actuator/health proves the database and Blob connections
management.endpoint.health.show-components=always
# The pod is only ready while the database answers; Blob is reported but never takes the pod out of service
management.endpoint.health.group.readiness.include=readinessState,db

# Google sign-in is a stretch goal and is off unless these are supplied by the environment
# (SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID / _CLIENT_SECRET). No defaults here.
