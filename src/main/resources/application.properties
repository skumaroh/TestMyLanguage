server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false
# Vaadin production mode: disabled for local development
# Enable this for cloud deployment
vaadin.productionMode=false
# Disable pnpm for more reliable CI/CD builds
vaadin.pnpm.enable=false
# Allowed packages (whitelisted-packages is deprecated)
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,com.infotech.lang.application
# Language configuration - determines which language-specific resources to use
# Overridden in production by APP_LANGUAGE environment variable (tamil or hindi)
# If APP_LANGUAGE is not provided, the application will derive language from the datasource URL.
app.language=${APP_LANGUAGE:}

# Azure Storage Configuration
# Connection string for Azure Blob Storage
# Must be set via AZURE_STORAGE_CONNECTION_STRING environment variable
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Azure AI Speech (Text-to-Speech) Configuration
# Separate Cognitive Services Speech resource key/region, same Azure subscription as Blob Storage
# Must be set via AZURE_SPEECH_KEY / AZURE_SPEECH_REGION environment variables
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:}
azure.speech.max-retries=${AZURE_SPEECH_MAX_RETRIES:2}

# Azure AI Foundry Configuration (generates Writing Skills "Examples" content on demand)
# Endpoint is the unified Foundry resource endpoint, looks like
# https://<resource-name>.services.ai.azure.com (Keys and Endpoint page on the Foundry
# resource, NOT the Foundry project). Deployment is the name you gave the chat-completion
# model deployment under that resource's Foundry project (Build > Models > Deployments).
# Calls the OpenAI-compatible Responses API at <endpoint>/openai/v1/responses — no
# api-version query parameter needed for this surface.
# Must be set via AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_API_KEY / AZURE_OPENAI_DEPLOYMENT
# environment variables.
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}

# Azure OpenAI image-generation deployment (Feature 4, image-generation doc §4.1/§4.6) —
# gpt-image-1-mini on a SEPARATE Azure resource from azure.openai.* above (its own endpoint and
# API key, not shared with the text deployment). Confirmed against Microsoft Foundry's own
# generated sample code for this deployment: calls the same unified v1 surface/Bearer auth the
# text deployment uses (<image-endpoint>/openai/v1/images/generations). The image-endpoint value
# can be set to either the bare resource root or the full .../openai/v1 string Foundry's portal
# displays — AzureImageGenerationService normalizes either form. Must be set via
# AZURE_OPENAI_IMAGE_ENDPOINT / AZURE_OPENAI_IMAGE_API_KEY / AZURE_OPENAI_IMAGE_DEPLOYMENT
# environment variables.
azure.openai.image-endpoint=${AZURE_OPENAI_IMAGE_ENDPOINT:}
azure.openai.image-api-key=${AZURE_OPENAI_IMAGE_API_KEY:}
azure.openai.image-deployment=${AZURE_OPENAI_IMAGE_DEPLOYMENT:}

# Play page: number of letter-tile buttons shown per round (the correct letter(s) for the
# current word plus randomly-picked distractors). Same value for every language deployment
# unless overridden per-environment via GAME_LETTER_TILE_COUNT.
game.letter-tile-count=${GAME_LETTER_TILE_COUNT:12}

# Multipart upload limits (Vaadin file upload uses Spring multipart)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

