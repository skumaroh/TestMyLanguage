# PostgreSQL configuration.
#spring.datasource.url = jdbc:postgresql://localhost:5432/tamil
#spring.datasource.username = postgres
#spring.datasource.password = admin
#spring.jpa.hibernate.ddl-auto = update
#configuration.resourceGroup=4dbf7a1a-23c4-431b-bf61-7876ae134035
# Hibernate properties
# Remove explicit dialect - Hibernate will auto-detect PostgreSQL
spring.jpa.show-sql = false
#spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.hibernate.naming.implicit-strategy = org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.properties.hibernate.format_sql=true
# Disable open-in-view to avoid lazy loading issues
spring.jpa.open-in-view=false
# Disable Hibernate DDL - Flyway handles schema migrations
spring.jpa.hibernate.ddl-auto = none
# Ensure Hibernate reads/writes timestamps as UTC regardless of JVM timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# PostgreSQL — overridden in prod by Kubernetes secret (langtool-secrets). Local dev: set DATABASE_URL or update default below
spring.datasource.url=${DATABASE_URL}
#spring.datasource.driver-class-name=org.postgresql.Driver
# Azure Blob Storage Configuration
# Used by AzureBlobService for multimedia asset uploads (images, audio, video)
# Get connection string from Azure Portal > Storage Account > Access Keys
# Format: DefaultEndpointsProtocol=https;AccountName={accountName};AccountKey={accountKey};EndpointSuffix=core.windows.net
# Production: Set AZURE_STORAGE_CONNECTION_STRING environment variable or configure in Kubernetes secrets
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Handwriting shape-match threshold (0.0-1.0)
# Minimum similarity score (75%) between a submitted handwriting sample and its admin-provided
# reference letter for LocalImageShapeComparisonService to mark it "correct".
handwriting.shape-match.threshold=${HANDWRITING_SHAPE_MATCH_THRESHOLD:0.75}

# Handwriting shape-match sigma (pixels, on the service's 64x64 normalized canvas)
# Controls how quickly similarity falls off with average stroke distance between the
# submitted drawing and the reference letter. Larger = more forgiving of misalignment/
# stroke-thickness/rotation differences. Tune this against real attempts in the
# /letter-demo admin panel (Recent Attempts -> Re-run recognition -> Refresh) if scores
# don't land where expected - the right value depends on actual handwriting samples.
handwriting.shape-match.sigma=${HANDWRITING_SHAPE_MATCH_SIGMA:10.0}

# SendGrid Email Configuration
# Get your API key from: https://app.sendgrid.com/settings/api_keys
# from.email's domain must be verified in SendGrid (Settings > Sender Authentication)
# or sends will be rejected/spam-filtered — mylangskills.com is the domain actually
# owned/controlled for this app, unlike the placeholder languagetool.com previously here.
sendgrid.api.key=${SENDGRID_API_KEY:YOUR_SENDGRID_API_KEY_HERE}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@mylangskills.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:LanguageTool}

# Application URLs for email links
app.base.url=${APP_BASE_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:8080}

# Acceptimico KnowledgeRetrievalService (Phase 1 PR 7) — docs/acceptimico/09-knowledge-retrieval-engine.md
# and docs/acceptimico/01-retrieval-architecture.md §10.1. Defaults match those docs' steady-state
# numbers; every value here is a starting-point guess per 01 §5.4, meant to be tuned once real
# turns exist. Only one threshold set (STEADY_STATE) — the dual bootstrap/steady-state machinery
# from 01 §4.3.3 is deliberately not built in this PR (see ConfidenceScorer's class javadoc).
acceptimico.retrieval.confidence.weight.intentMatch=${ACCEPTIMICO_WEIGHT_INTENT_MATCH:0.20}
acceptimico.retrieval.confidence.weight.scenarioMatch=${ACCEPTIMICO_WEIGHT_SCENARIO_MATCH:0.15}
acceptimico.retrieval.confidence.weight.entityCoverage=${ACCEPTIMICO_WEIGHT_ENTITY_COVERAGE:0.20}
acceptimico.retrieval.confidence.weight.tenseMatch=${ACCEPTIMICO_WEIGHT_TENSE_MATCH:0.10}
acceptimico.retrieval.confidence.weight.politenessMatch=${ACCEPTIMICO_WEIGHT_POLITENESS_MATCH:0.10}
acceptimico.retrieval.confidence.weight.registerMatch=${ACCEPTIMICO_WEIGHT_REGISTER_MATCH:0.05}
acceptimico.retrieval.confidence.weight.semanticSimilarity=${ACCEPTIMICO_WEIGHT_SEMANTIC_SIMILARITY:0.20}
acceptimico.retrieval.confidence.trust.VERIFIED=${ACCEPTIMICO_TRUST_VERIFIED:1.00}
acceptimico.retrieval.confidence.trust.CORRECTED=${ACCEPTIMICO_TRUST_CORRECTED:1.00}
acceptimico.retrieval.confidence.trust.PENDING_REVIEW=${ACCEPTIMICO_TRUST_PENDING_REVIEW:0.85}
acceptimico.retrieval.confidence.trust.AI_GENERATED=${ACCEPTIMICO_TRUST_AI_GENERATED:0.75}
acceptimico.retrieval.confidence.evidence.cap=${ACCEPTIMICO_EVIDENCE_CAP:0.05}
acceptimico.retrieval.confidence.threshold.high=${ACCEPTIMICO_THRESHOLD_HIGH:0.85}
acceptimico.retrieval.confidence.threshold.medium=${ACCEPTIMICO_THRESHOLD_MEDIUM:0.70}
acceptimico.retrieval.confidence.threshold.low=${ACCEPTIMICO_THRESHOLD_LOW:0.50}
acceptimico.retrieval.extraction.minConfidenceForHighBand=${ACCEPTIMICO_MIN_EXTRACTION_CONFIDENCE_FOR_HIGH:0.60}
acceptimico.retrieval.candidates.perBranchLimit=${ACCEPTIMICO_CANDIDATES_PER_BRANCH_LIMIT:20}
acceptimico.retrieval.candidates.alternativesReturned=${ACCEPTIMICO_ALTERNATIVES_RETURNED:2}
# Not in 01 §10.1's table verbatim (that doc's own draft used a different "engine.*" prefix for
# this one setting) — kept under this feature's single acceptimico.retrieval.* prefix for
# consistency, with the epsilon value this PR's task brief suggested rather than 01's own 0.05.
acceptimico.retrieval.diagnostics.nearMissEpsilon=${ACCEPTIMICO_NEAR_MISS_EPSILON:0.02}
